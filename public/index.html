<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToolShop</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #6b7280;
      --accent: #e8590c;
      --accent-dark: #c2410c;
      --error: #b00020;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--text);
      color: #fff;
      padding: 16px max(16px, calc((100% - 960px) / 2 + 16px));
    }
    header h1 { margin: 0; font-size: 24px; }
    header h1 span { color: var(--accent); }
    header p { margin: 4px 0 0; color: #cbd2d9; font-size: 14px; }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    .toolbar { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    button:disabled { opacity: 0.6; cursor: wait; }
    #status { margin: 0; color: var(--muted); }
    #status.error { color: var(--error); }
    #items {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    #items li {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    #items .id { color: var(--muted); font-size: 13px; }
    #items .name { margin-top: 6px; font-weight: 600; }
    #items .price { margin-top: 10px; color: var(--accent-dark); font-size: 14px; }
    #items .buy { margin-top: 12px; padding: 6px 14px; font-size: 14px; }
    #degraded {
      background: #fff4e5;
      border: 1px solid #f59e0b;
      color: #7c2d12;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Tool<span>Shop</span></h1>
    <p>Верстати та електроінструмент</p>
  </header>

  <main>
    <div id="degraded" role="alert" hidden>
      <strong>Сервер перевантажено.</strong> Кілька запитів поспіль не вдалися — кнопки тимчасово вимкнено, спробуйте за 10 секунд.
    </div>
    <div class="toolbar">
      <button id="load">Load items</button>
      <p id="status"></p>
    </div>
    <ul id="items"></ul>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
