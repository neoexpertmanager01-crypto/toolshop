<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="1600" height="1060" fill="#ffffff"/>

  <text x="40" y="44" font-size="26" font-weight="700" fill="#1f2933">ToolShop у Kubernetes — теоретична схема</text>
  <text x="40" y="70" font-size="15" fill="#6b7280">Шлях запиту: Client → DNS → Load Balancer → Ingress → Service → Pods.  Шлях коду: git → CI/CD → registry → Pods.</text>

  <!-- ===== CI/CD chain ===== -->
  <rect x="560" y="95" width="270" height="100" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="695" y="128" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">git-репозиторій</text>
  <text x="695" y="152" font-size="13" text-anchor="middle" fill="#374151">github.com/neoexpertmanager01-crypto</text>
  <text x="695" y="170" font-size="13" text-anchor="middle" fill="#374151">/toolshop</text>

  <rect x="890" y="95" width="300" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1040" y="128" font-size="17" font-weight="700" text-anchor="middle" fill="#4c1d95">CI/CD — GitHub Actions</text>
  <text x="1040" y="152" font-size="13" text-anchor="middle" fill="#4c1d95">npm test → docker build</text>
  <text x="1040" y="170" font-size="13" text-anchor="middle" fill="#4c1d95">→ docker push (тег sha-&lt;commit&gt;)</text>

  <rect x="1250" y="95" width="310" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1405" y="128" font-size="17" font-weight="700" text-anchor="middle" fill="#4c1d95">Container registry — GHCR</text>
  <text x="1405" y="152" font-size="13" text-anchor="middle" fill="#4c1d95">ghcr.io/neoexpertmanager01-crypto/</text>
  <text x="1405" y="170" font-size="13" text-anchor="middle" fill="#4c1d95">toolshop-api:sha-b39355d</text>

  <line x1="830" y1="145" x2="886" y2="145" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="836" y="136" font-size="12" fill="#7c3aed">push</text>
  <line x1="1190" y1="145" x2="1246" y2="145" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="1196" y="136" font-size="12" fill="#7c3aed">image</text>

  <!-- ===== External chain ===== -->
  <rect x="40" y="270" width="210" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="145" y="303" font-size="17" font-weight="700" text-anchor="middle" fill="#0c4a6e">User / Client</text>
  <text x="145" y="327" font-size="13" text-anchor="middle" fill="#0c4a6e">браузер покупця</text>

  <rect x="40" y="410" width="210" height="90" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="145" y="442" font-size="17" font-weight="700" text-anchor="middle" fill="#0c4a6e">DNS</text>
  <text x="145" y="465" font-size="13" text-anchor="middle" fill="#0c4a6e">shop.toolshop.com.ua</text>
  <text x="145" y="484" font-size="13" text-anchor="middle" fill="#0c4a6e">→ IP балансувальника</text>

  <rect x="40" y="560" width="210" height="90" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="145" y="592" font-size="17" font-weight="700" text-anchor="middle" fill="#0c4a6e">Load Balancer</text>
  <text x="145" y="615" font-size="13" text-anchor="middle" fill="#0c4a6e">хмарний, публічний IP</text>
  <text x="145" y="634" font-size="13" text-anchor="middle" fill="#0c4a6e">:80 / :443</text>

  <line x1="145" y1="350" x2="145" y2="406" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="145" y1="500" x2="145" y2="556" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- ===== Cluster ===== -->
  <rect x="290" y="235" width="1290" height="800" rx="14" fill="#f8fafc" stroke="#326ce5" stroke-width="3"/>
  <text x="310" y="265" font-size="19" font-weight="700" fill="#1e3a8a">Kubernetes cluster</text>
  <text x="310" y="287" font-size="13" fill="#1e3a8a">Node-1, Node-2 — робочі машини, на яких планувальник розміщує Pod-и</text>

  <!-- Ingress -->
  <rect x="315" y="320" width="270" height="200" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="450" y="352" font-size="17" font-weight="700" text-anchor="middle" fill="#064e3b">Ingress</text>
  <text x="450" y="373" font-size="13" text-anchor="middle" fill="#064e3b">toolshop-ingress (nginx)</text>
  <text x="330" y="404" font-size="13" fill="#064e3b">Host: shop.toolshop.com.ua</text>
  <text x="330" y="426" font-size="13" fill="#064e3b">/            → сторінка магазину</text>
  <text x="330" y="446" font-size="13" fill="#064e3b">/products  → API каталогу</text>
  <text x="330" y="466" font-size="13" fill="#064e3b">/orders     → API замовлень</text>
  <text x="330" y="494" font-size="13" font-weight="600" fill="#064e3b">усе → Service toolshop-api:80</text>

  <line x1="250" y1="605" x2="380" y2="524" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Namespace -->
  <rect x="620" y="305" width="940" height="710" rx="12" fill="#ffffff" stroke="#326ce5" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="640" y="333" font-size="16" font-weight="700" fill="#1e3a8a">Namespace: toolshop-prod</text>

  <!-- Service api -->
  <rect x="650" y="350" width="330" height="95" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="815" y="380" font-size="17" font-weight="700" text-anchor="middle" fill="#7c2d12">Service: toolshop-api</text>
  <text x="815" y="403" font-size="13" text-anchor="middle" fill="#7c2d12">type: ClusterIP · port 80 → targetPort 8080</text>
  <text x="815" y="423" font-size="13" text-anchor="middle" fill="#7c2d12">DNS: http://toolshop-api</text>

  <line x1="585" y1="420" x2="646" y2="405" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Deployment -->
  <rect x="650" y="485" width="890" height="285" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="670" y="725" font-size="16" font-weight="700" fill="#78350f">Deployment: toolshop-api · replicas: 3</text>
  <text x="670" y="748" font-size="13" fill="#78350f">ReplicaSet підтримує 3 Pod-и; при падінні Pod-а створює новий</text>

  <!-- Pods -->
  <rect x="670" y="500" width="270" height="165" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="805" y="528" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2933">Pod toolshop-api-…-a1</text>
  <rect x="690" y="542" width="230" height="78" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="805" y="565" font-size="13" text-anchor="middle" fill="#1f2933">container: toolshop-api</text>
  <text x="805" y="585" font-size="12" text-anchor="middle" fill="#1f2933">toolshop-api:sha-b39355d</text>
  <text x="805" y="605" font-size="12" text-anchor="middle" fill="#1f2933">:8080 · /health</text>
  <text x="805" y="648" font-size="12" text-anchor="middle" fill="#6b7280">Node-1</text>

  <rect x="960" y="500" width="270" height="165" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="1095" y="528" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2933">Pod toolshop-api-…-b2</text>
  <rect x="980" y="542" width="230" height="78" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="1095" y="565" font-size="13" text-anchor="middle" fill="#1f2933">container: toolshop-api</text>
  <text x="1095" y="585" font-size="12" text-anchor="middle" fill="#1f2933">toolshop-api:sha-b39355d</text>
  <text x="1095" y="605" font-size="12" text-anchor="middle" fill="#1f2933">:8080 · /health</text>
  <text x="1095" y="648" font-size="12" text-anchor="middle" fill="#6b7280">Node-2</text>

  <rect x="1250" y="500" width="270" height="165" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="1385" y="528" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2933">Pod toolshop-api-…-c3</text>
  <rect x="1270" y="542" width="230" height="78" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="1385" y="565" font-size="13" text-anchor="middle" fill="#1f2933">container: toolshop-api</text>
  <text x="1385" y="585" font-size="12" text-anchor="middle" fill="#1f2933">toolshop-api:sha-b39355d</text>
  <text x="1385" y="605" font-size="12" text-anchor="middle" fill="#1f2933">:8080 · /health</text>
  <text x="1385" y="648" font-size="12" text-anchor="middle" fill="#6b7280">Node-1</text>

  <!-- Service -> pods -->
  <line x1="780" y1="445" x2="800" y2="496" stroke="#374151" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="850" y1="445" x2="1080" y2="496" stroke="#374151" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="930" y1="445" x2="1360" y2="496" stroke="#374151" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="995" y="395" font-size="13" fill="#374151">розподіляє трафік</text>
  <text x="995" y="413" font-size="13" fill="#374151">між усіма Pod-ами</text>

  <!-- Registry -> pods (image pull) -->
  <path d="M1500,195 L1500,470 L1385,470 L1385,496" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#ab)"/>
  <text x="1490" y="378" font-size="13" text-anchor="end" fill="#7c3aed">image pull</text>
  <text x="1490" y="396" font-size="13" text-anchor="end" fill="#7c3aed">під час</text>
  <text x="1490" y="414" font-size="13" text-anchor="end" fill="#7c3aed">старту Pod-а</text>

  <!-- DB -->
  <rect x="650" y="800" width="330" height="95" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="815" y="830" font-size="17" font-weight="700" text-anchor="middle" fill="#7c2d12">Service: toolshop-db</text>
  <text x="815" y="853" font-size="13" text-anchor="middle" fill="#7c2d12">ClusterIP · port 5432</text>
  <text x="815" y="873" font-size="13" text-anchor="middle" fill="#7c2d12">DNS: toolshop-db:5432</text>

  <rect x="1020" y="770" width="300" height="140" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="1170" y="800" font-size="16" font-weight="700" text-anchor="middle" fill="#064e3b">StatefulSet: postgres</text>
  <text x="1170" y="822" font-size="13" text-anchor="middle" fill="#064e3b">Pod postgres-0 · postgres:16-alpine</text>
  <rect x="1060" y="840" width="220" height="50" rx="6" fill="#d1fae5" stroke="#047857"/>
  <text x="1170" y="862" font-size="13" text-anchor="middle" fill="#064e3b">PersistentVolumeClaim</text>
  <text x="1170" y="880" font-size="12" text-anchor="middle" fill="#064e3b">дані БД, 5 Gi</text>

  <path d="M670,600 L638,600 L638,848 L646,848" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="650" y="915" font-size="13" fill="#374151">Pod-и API → toolshop-db:5432 (SQL через DNS-ім'я сервісу)</text>
  <line x1="980" y1="848" x2="1016" y2="848" stroke="#374151" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- Config -->
  <rect x="1350" y="770" width="190" height="140" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="1445" y="800" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2933">ConfigMap</text>
  <text x="1445" y="820" font-size="12" text-anchor="middle" fill="#374151">PORT, RATE_LIMIT_MAX</text>
  <text x="1445" y="856" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2933">Secret</text>
  <text x="1445" y="876" font-size="12" text-anchor="middle" fill="#374151">DATABASE_URL</text>
  <line x1="1445" y1="770" x2="1430" y2="669" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="1452" y="705" font-size="12" fill="#475569">envFrom</text>

  <text x="650" y="960" font-size="13" fill="#374151">Повний шлях запиту: браузер → DNS (shop.toolshop.com.ua) → Load Balancer → Ingress (Host + Path)</text>
  <text x="650" y="980" font-size="13" fill="#374151">→ Service toolshop-api (ClusterIP) → один із 3 Pod-ів → Service toolshop-db → postgres-0.</text>
</svg>
