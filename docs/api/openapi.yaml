openapi: 3.0.3
info:
  title: ToolShop API
  version: 1.0.0
  description: |
    API міні-магазину інструментів ToolShop.
    Контекст «Каталог»: CRUD товарів. Контекст «Замовлення»: ідемпотентне створення замовлень.
    Усі помилки повертаються в єдиному форматі `ErrorResponse`; кожна відповідь має заголовок `X-Request-Id`.
    API-маршрути обмежені rate-limit: при перевищенні — `429` із заголовком `Retry-After`.
servers:
  - url: http://localhost:8080
    description: Локальний запуск

tags:
  - name: Products
    description: Товари каталогу
  - name: Orders
    description: Замовлення
  - name: System
    description: Службові ендпоінти

paths:
  /health:
    get:
      tags: [System]
      summary: Перевірка, що сервіс працює
      operationId: getHealth
      responses:
        "200":
          description: Сервіс працює
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /products:
    get:
      tags: [Products]
      summary: Список товарів
      operationId: listProducts
      responses:
        "200":
          description: Список товарів
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponse"
    post:
      tags: [Products]
      summary: Створити товар
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
      responses:
        "201":
          description: Товар створено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Ідентифікатор товару
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Products]
      summary: Деталі товару
      operationId: getProduct
      responses:
        "200":
          description: Товар
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Products]
      summary: Частково оновити товар
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateRequest"
      responses:
        "200":
          description: Оновлений товар
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Products]
      summary: Видалити товар
      operationId: deleteProduct
      responses:
        "204":
          description: Товар видалено
        "404":
          $ref: "#/components/responses/NotFound"

  /orders:
    post:
      tags: [Orders]
      summary: Створити замовлення (ідемпотентно)
      description: |
        Повтор запиту з тим самим `Idempotency-Key` і тим самим тілом повертає те саме замовлення
        (без дубля й повторного списання залишку) та заголовок `Idempotent-Replayed: true`.
        Той самий ключ з іншим тілом — `422`.
      operationId: createOrder
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
      responses:
        "201":
          description: Замовлення створено (або повернуто раніше створене за тим самим ключем)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Idempotent-Replayed:
              description: true, якщо це повтор раніше виконаного запиту
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Недостатньо товару на складі
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Conflict
                code: INSUFFICIENT_STOCK
                details:
                  - field: "product:4"
                    message: Only 1 of «Рейсмусовий верстат 305 мм» left
                requestId: 3f409199-d39b-4a7f-a8ac-1e75f81125e8
        "422":
          description: Idempotency-Key уже використано з іншим тілом запиту
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: UnprocessableEntity
                code: IDEMPOTENCY_KEY_REUSED
                requestId: demo-3
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Деталі замовлення
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Замовлення
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Унікальний ключ операції (UUID); повтори з тим самим ключем не створюють дублів
      schema:
        type: string
        minLength: 8
        maxLength: 200
      example: 5b0c8f2e-6a1d-4f7e-9b3a-2d4c1e8f7a60
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Ідентифікатор запиту для кореляції логів; якщо не передано — генерується сервером
      schema:
        type: string

  headers:
    X-Request-Id:
      description: Ідентифікатор запиту (той самий, що в тілі помилки `requestId`)
      schema:
        type: string

  schemas:
    ProductCreateRequest:
      type: object
      required: [name, price]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Фрезер ручний 1200 Вт
        categoryId:
          type: string
          nullable: true
          example: routers
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
          example: 3500
        stock:
          type: integer
          minimum: 0
          default: 0
          example: 5

    ProductUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Передаються лише ті поля, які треба змінити.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Фрезер ручний 1400 Вт
        categoryId:
          type: string
          nullable: true
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
          example: 3900
        stock:
          type: integer
          minimum: 0
          example: 3

    ProductResponse:
      type: object
      required: [id, name, categoryId, price, stock, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Фрезер ручний 1200 Вт
        categoryId:
          type: string
          nullable: true
          example: routers
        price:
          type: number
          example: 3500
        stock:
          type: integer
          example: 5
        createdAt:
          type: string
          format: date-time
          example: "2026-11-17T10:15:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-11-17T11:20:00Z"

    OrderCreateRequest:
      type: object
      required: [items]
      properties:
        customerId:
          type: string
          description: Покупець; без авторизації за замовчуванням "guest"
          example: guest
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId]
            properties:
              productId:
                type: integer
                minimum: 1
                example: 1
              quantity:
                type: integer
                minimum: 1
                maximum: 100
                default: 1
                example: 2

    OrderResponse:
      type: object
      required: [id, customerId, status, total, items, createdAt]
      properties:
        id:
          type: integer
          example: 4
        customerId:
          type: string
          example: guest
        status:
          type: string
          enum: [new, confirmed, shipped, cancelled]
        total:
          type: number
          example: 7000
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: integer
                example: 1
              productName:
                type: string
                example: Фрезер ручний 1200 Вт
              unitPrice:
                type: number
                example: 3500
              quantity:
                type: integer
                example: 2
        createdAt:
          type: string
          format: date-time
        requestId:
          type: string

    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: string
          description: Тип помилки
          example: ValidationError
        code:
          type: string
          description: Машинний код конкретної причини
          example: NAME_REQUIRED
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: name
              message:
                type: string
                example: Name is required
        requestId:
          type: string
          description: Той самий ідентифікатор, що в заголовку X-Request-Id
          example: 233e4bc9-5b06-4550-86b1-20a7b4413b49

  responses:
    ValidationError:
      description: Некоректні вхідні дані
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: ValidationError
            code: NAME_REQUIRED
            details:
              - field: name
                message: Name is required
            requestId: 233e4bc9-5b06-4550-86b1-20a7b4413b49
    TooManyRequests:
      description: Перевищено ліміт запитів; повторити після Retry-After секунд
      headers:
        Retry-After:
          description: Через скільки секунд можна повторити запит
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: TooManyRequests
            code: RATE_LIMITED
            requestId: 3f409199-d39b-4a7f-a8ac-1e75f81125e8
    NotFound:
      description: Товар не знайдено
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: NotFound
            code: PRODUCT_NOT_FOUND
            requestId: 233e4bc9-5b06-4550-86b1-20a7b4413b49
