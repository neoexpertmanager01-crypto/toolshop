<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#1f2933">ToolShop — карта контекстів (Context Map)</text>
  <text x="40" y="76" font-size="15" fill="#6b7280">Bounded contexts і те, які дані вони передають один одному</text>

  <!-- Identity -->
  <rect x="60" y="130" width="280" height="130" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="200" y="168" font-size="20" font-weight="700" text-anchor="middle" fill="#581c87">Користувачі</text>
  <text x="200" y="192" font-size="14" text-anchor="middle" fill="#581c87">Identity · generic</text>
  <text x="200" y="228" font-size="15" text-anchor="middle" fill="#1f2933">User</text>

  <!-- Catalog -->
  <rect x="60" y="450" width="280" height="130" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="200" y="488" font-size="20" font-weight="700" text-anchor="middle" fill="#0c4a6e">Каталог</text>
  <text x="200" y="512" font-size="14" text-anchor="middle" fill="#0c4a6e">Catalog · supporting</text>
  <text x="200" y="548" font-size="15" text-anchor="middle" fill="#1f2933">Category, Product</text>

  <!-- Ordering (core) -->
  <rect x="460" y="280" width="290" height="150" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="605" y="322" font-size="22" font-weight="700" text-anchor="middle" fill="#7c2d12">Замовлення</text>
  <text x="605" y="346" font-size="14" text-anchor="middle" fill="#7c2d12">Ordering · core</text>
  <text x="605" y="384" font-size="15" text-anchor="middle" fill="#1f2933">Order, OrderItem</text>

  <!-- Payment -->
  <rect x="870" y="130" width="280" height="130" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="1010" y="168" font-size="20" font-weight="700" text-anchor="middle" fill="#064e3b">Оплата</text>
  <text x="1010" y="192" font-size="14" text-anchor="middle" fill="#064e3b">Payment · generic</text>
  <text x="1010" y="228" font-size="15" text-anchor="middle" fill="#1f2933">Payment</text>

  <!-- Delivery -->
  <rect x="870" y="450" width="280" height="130" rx="12" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="1010" y="488" font-size="20" font-weight="700" text-anchor="middle" fill="#713f12">Доставка</text>
  <text x="1010" y="512" font-size="14" text-anchor="middle" fill="#713f12">Delivery · generic</text>
  <text x="1010" y="548" font-size="15" text-anchor="middle" fill="#1f2933">Shipment</text>

  <!-- Identity -> Ordering -->
  <line x1="340" y1="215" x2="500" y2="278" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="300" y="290" font-size="14" fill="#374151">ідентифікатор покупця</text>
  <text x="300" y="308" font-size="14" fill="#374151">(customerId)</text>

  <!-- Catalog -> Ordering : price snapshot -->
  <line x1="340" y1="480" x2="495" y2="420" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="250" y="412" font-size="14" fill="#374151">назва й ціна товару</text>
  <text x="250" y="430" font-size="14" fill="#374151">на момент замовлення</text>
  <!-- Ordering -> Catalog : reserve -->
  <line x1="520" y1="430" x2="345" y2="545" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="420" y="545" font-size="14" fill="#374151">резервує залишок</text>

  <!-- Ordering -> Payment -->
  <line x1="700" y1="280" x2="868" y2="215" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="595" y="240" font-size="14" fill="#374151">створює платіж</text>
  <text x="595" y="258" font-size="14" fill="#374151">на суму замовлення</text>
  <!-- Payment -> Ordering -->
  <line x1="880" y1="262" x2="752" y2="320" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="815" y="320" font-size="14" fill="#374151">«оплачено» → замовлення</text>
  <text x="815" y="338" font-size="14" fill="#374151">можна відправляти</text>

  <!-- Ordering -> Delivery -->
  <line x1="752" y1="400" x2="868" y2="480" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="700" y="490" font-size="14" fill="#374151">передає підтверджене</text>
  <text x="700" y="508" font-size="14" fill="#374151">замовлення й адресу</text>

  <text x="40" y="650" font-size="14" fill="#6b7280">core — головний піддомен (бізнес-цінність магазину); supporting — допоміжний; generic — типовий, можна замінити готовим сервісом.</text>
</svg>
